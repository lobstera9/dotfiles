wallpaper {
    # Leave 'monitor' blank to apply to all connected monitors
    monitor = 
    
    # Path to the directory containing your images (use absolute paths)
    path = $HOME/Pictures/Wallpaper
    
    # Randomize the selection order
    order = random
    
    # Time between automatic wallpaper changes (in seconds)
    timeout = 300
    
    # Scaling mode (cover, contain, tile, or fill)
    fit_mode = cover
}

# Optional: Disable the startup splash text
splash = false
